<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Biblioteca</title>
</head>
<body>
    <h1>Bienvenido a la Biblioteca</h1>
    <br>
    <button id="mostrar">Mostrar todos los libros</button>
    <span id="show"></span>
    <br>
    <form action="" method="post">
        <h2>Ingresar un nuevo libro</h2>
        <label for="titulo">Titulo</label>
        <input type="text" name="titulo" id="titulo">
        <label for="autor">Autor</label>
        <input type="text" name="autor" id="autor">
        <label for="año">Año</label>
        <input type="number" name="año" id="año">
        <label for="genero">Genero</label>
        <input type="text" name="genero" id="genero">
        <input type="submit" value="Agregar" id="submit">
    </form>
    <br>
    <form method="get">
        <h2>Buscar un libro</h2>
        <label for="buscar_autor">Por autor: </label>
        <input type="text" id="buscar_autor" name="buscar_autor">
        <input type="button" value="Buscar" id="por_autor">
    </form>
    <span id="show_autor"></span>
</body>
<script>
    const botonMostrar = document.getElementById("mostrar");
    
    async function obtenerLibros() {
        const response = await fetch("http://127.0.0.1:5000/libros");
        const datos = await response.json();
        console.log(datos);
        return datos;
    }

    async function agregarLibro() {
        const titulo = document.getElementById("titulo").value; 
        const autor = document.getElementById("autor").value; 
        const año = parseInt(document.getElementById("año").value); 
        const genero = document.getElementById("genero").value; 

        const response = await fetch("http://127.0.0.1:5000/libros", {
            method: "POST",
            headers: {"Content-Type": "application/json"}, 
            body: JSON.stringify({titulo, autor, año, genero})
        });
        const datos = await response.json();
        console.log(datos);
    }

    async function buscarAutor() {
        const autor = document.getElementById("buscar_autor").value;
        const url = "http://127.0.0.1:5000/libros/autor" + "/" + autor; 
        const response = await fetch(url); 
        const datos = await response.json();
        console.log(datos); 
        return datos;
    }

    document.getElementById("mostrar").addEventListener("click", async function() {
        const libros = await obtenerLibros();
        document.getElementById("show").innerHTML = libros.map(
            libro => `<p>${libro.titulo} - ${libro.autor} - ${libro.año} - ${libro.genero}</p>`
        ).join("");
    });

    document.getElementById("submit").addEventListener("click", async function(event) {
        event.preventDefault(); 
        await agregarLibro();
    });

    document.getElementById("por_autor").addEventListener("click", async function () {
        const libros = await buscarAutor(); 
        document.getElementById("show_autor").innerHTML = libros.map(
            libro => `<p>${libro.titulo} - ${libro.año} - ${libro.genero}</p>`
        ).join("");
    });


</script>
</html>
